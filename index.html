<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="robots" content="noindex"><link rel="icon" href="data:,"><title>CYF综合工作台 · 暂停开放</title>
<style>
:root{--bg:#0E0F11;--panel:#16181B;--line:#343A42;--text:#E8EAED;--text-dim:#A2A8B2;--accent:#FFD400;--info:#25C2E8;--font-ui:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--font-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace}
@media(prefers-color-scheme:light){:root{--bg:#E3E7EC;--panel:#F4F6F8;--line:#CDD3DA;--text:#202830;--text-dim:#49535D;--info:#065B73}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
.lock{position:relative;width:min(440px,100%);padding:32px 30px 28px;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.lock::before,.lock::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.lock::before{left:8px;top:8px;border-left:1px solid var(--info);border-top:1px solid var(--info)}
.lock::after{right:8px;bottom:8px;border-right:1px solid var(--info);border-bottom:1px solid var(--info)}
.eyebrow{margin:0 0 14px;font:11px/1.6 var(--font-mono);letter-spacing:.16em;color:var(--text-dim)}
.badge{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:4px 10px;border:1px solid var(--line);font:600 12px/1.6 var(--font-mono);letter-spacing:.12em;color:var(--text)}
.badge::before{content:"";width:8px;height:8px;background:var(--accent)}
h1{margin:0 0 10px;font-size:24px;line-height:1.4;font-weight:700}
p{margin:0;line-height:1.8;color:var(--text-dim);font-size:14px}
p+p{margin-top:10px}
.field{margin-top:22px;padding:12px 14px;border:1px dashed var(--line);color:var(--text-dim);font-size:13px}
</style></head>
<body>
<main class="lock" role="main" aria-labelledby="lock-title">
<p class="eyebrow">CYF · WORKBENCH</p>
<span class="badge">LOCKED / 已封锁</span>
<h1 id="lock-title">工作台暂停开放</h1>
<p>CYF 综合工作台目前不对外开放，暂不接受登录。</p>
<p>你之前在这个浏览器里保存的工程数据不会被删除，恢复开放后仍可继续使用。</p>
<div class="field" aria-hidden="true">访问口令 · 暂停受理</div>
</main>
</body></html>
